name: CI

# Runs on every push and pull request to main. This is the quality gate:
# broken code never merges because lint, tests, and the production build must
# all pass first.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build (production)
        run: npm run build
        env:
          # A dummy value so the build never blocks on a missing var. No real
          # database is contacted at build time (all DB routes are dynamic).
          DATABASE_URL: postgres://user:pass@localhost:5432/db

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test # only build the image if the quality gate passed
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false # flip to true once you add a registry + credentials
          tags: infra-health-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
