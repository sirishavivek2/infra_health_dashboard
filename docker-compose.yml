# One command to run the whole stack locally:  docker compose up --build
# Starts Postgres (with the schema pre-loaded) and the Next.js app wired to it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: infra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-applies the schema + seed data the first time the volume is created.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d infra"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Note: credentials come from the environment, never from the image.
      DATABASE_URL: postgres://dashboard:dashboard@db:5432/infra
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
