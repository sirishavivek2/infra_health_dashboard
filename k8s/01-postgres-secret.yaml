# Database credentials live in a Secret, not baked into any image or manifest
# body. `stringData` lets us write plain values here; Kubernetes stores them
# base64-encoded. In a real cluster you'd manage this with a sealed-secret or an
# external secrets manager rather than committing it — this file is for the demo.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: infra-health
type: Opaque
stringData:
  POSTGRES_USER: dashboard
  POSTGRES_PASSWORD: dashboard
  POSTGRES_DB: infra
  # The full connection string the app consumes. Host "postgres" is the
  # Postgres Service name below — Kubernetes DNS resolves it inside the cluster.
  DATABASE_URL: postgres://dashboard:dashboard@postgres:5432/infra
